<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本史 - Japanese History</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08081a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08081a;--bg2:#0e0e26;--bg3:#161640;--accent:#ff6348;--accent2:#ff8566;--gold:#e6b422;--text:#eae8e5;--text2:#9896a1;--text3:#6b6980;--card:rgba(20,20,52,.55);--card2:rgba(30,30,68,.5);--border:rgba(60,60,120,.35);--success:#4ecdc4;--danger:#ff6b6b;--info:#45b7d1;--purple:#a855f7;--radius:14px;--shadow:0 8px 32px rgba(0,0,0,.45);--glass:rgba(18,18,48,.45);--glass-border:rgba(100,100,180,.18);--glass-blur:blur(18px)}
html{scroll-behavior:smooth}
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.7;background-image:radial-gradient(ellipse at 20% 0%,rgba(120,60,200,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(255,99,72,.07) 0%,transparent 50%)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--glass-border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:1.3rem;font-weight:800;color:var(--accent);letter-spacing:.05em}
.header-title span{color:var(--gold);font-size:.8rem;margin-left:6px;font-weight:400}
.header-search{display:flex;align-items:center;gap:8px;background:rgba(26,26,62,.6);border:1px solid var(--glass-border);border-radius:10px;padding:4px 12px;width:260px;backdrop-filter:blur(8px)}
.header-search input{background:none;border:none;color:var(--text);font-size:.85rem;width:100%}
.header-search input::placeholder{color:var(--text3)}

/* Nav */
.nav{position:fixed;top:56px;left:0;right:0;z-index:99;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--glass-border);display:flex;overflow-x:auto;gap:0;padding:0 8px;height:44px;align-items:center;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{height:0}
.nav-btn{padding:8px 16px;font-size:.78rem;color:var(--text2);background:none;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s;flex-shrink:0}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Main */
.main{padding-top:112px;min-height:100vh;max-width:1200px;margin:0 auto;padding-left:16px;padding-right:16px;padding-bottom:40px}

/* Section titles */
.section-title{font-size:1.5rem;font-weight:800;margin:32px 0 20px;color:var(--text);display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:28px;background:var(--accent);border-radius:2px}

/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

/* Era card */
.era-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.era-card:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 0 40px rgba(255,99,72,.06);border-color:rgba(255,99,72,.35)}
.era-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));opacity:0;transition:.3s}
.era-card:hover::before{opacity:1}
.era-card .era-period{font-size:.72rem;color:var(--accent);font-weight:600;letter-spacing:.08em;margin-bottom:4px}
.era-card .era-name{font-size:1.2rem;font-weight:800;margin-bottom:6px}
.era-card .era-subtitle{font-size:.8rem;color:var(--text2);margin-bottom:10px}
.era-card .era-tags{display:flex;flex-wrap:wrap;gap:4px}
.era-card .era-tag{font-size:.65rem;padding:2px 8px;background:rgba(22,22,64,.5);border-radius:10px;color:var(--text2);border:1px solid rgba(60,60,120,.2)}
.era-card .bookmark-btn{position:absolute;top:12px;right:12px;background:none;color:var(--text3);font-size:1.1rem;transition:.2s;padding:4px}
.era-card .bookmark-btn.active{color:var(--gold)}
.era-card .bookmark-btn:hover{color:var(--gold)}

/* Detail view */
.detail-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.detail-overlay.open{display:flex}
.detail-panel{background:rgba(12,12,30,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:18px;max-width:800px;width:100%;margin-top:40px;margin-bottom:40px;overflow:hidden;animation:slideUp .3s ease;box-shadow:0 16px 64px rgba(0,0,0,.5)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.detail-header{padding:28px 28px 20px;background:linear-gradient(135deg,rgba(18,18,42,.6),rgba(26,26,62,.6));border-bottom:1px solid var(--glass-border);position:relative}
.detail-close{position:absolute;top:16px;right:16px;background:rgba(8,8,26,.7);border:1px solid var(--glass-border);color:var(--text2);width:36px;height:36px;border-radius:50%;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.detail-close:hover{color:var(--accent);border-color:var(--accent)}
.detail-header .era-label{font-size:.75rem;color:var(--accent);font-weight:600;letter-spacing:.1em}
.detail-header h2{font-size:1.6rem;font-weight:800;margin:4px 0}
.detail-header .era-period-full{color:var(--text2);font-size:.85rem}
.detail-body{padding:24px 28px}
.detail-section{margin-bottom:24px}
.detail-section h3{font-size:1rem;font-weight:700;margin-bottom:10px;color:var(--accent);display:flex;align-items:center;gap:8px}
.detail-section h3::before{content:'';width:3px;height:16px;background:var(--accent);border-radius:2px}
.detail-list{list-style:none}
.detail-list li{padding:6px 0;border-bottom:1px solid var(--glass-border);font-size:.85rem;display:flex;gap:8px}
.detail-list li:last-child{border-bottom:none}
.detail-list .year{color:var(--gold);font-weight:600;min-width:60px;flex-shrink:0}
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person-chip{background:rgba(30,30,68,.45);border:1px solid var(--glass-border);border-radius:10px;padding:10px;font-size:.8rem;cursor:pointer;transition:.2s;backdrop-filter:blur(6px)}
.person-chip:hover{border-color:rgba(255,99,72,.35);background:rgba(26,26,62,.6)}
.person-chip .name{font-weight:700;margin-bottom:2px}
.person-chip .role{color:var(--text2);font-size:.72rem}
.culture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.culture-item{background:rgba(22,22,64,.4);border:1px solid var(--glass-border);border-radius:10px;padding:10px;font-size:.8rem}
.culture-item .cat{color:var(--purple);font-size:.7rem;font-weight:600;margin-bottom:2px}

/* Timeline */
.timeline-wrap{position:relative;padding:20px 0 20px 40px}
.timeline-line{position:absolute;left:18px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),var(--gold),var(--accent))}
.timeline-item{position:relative;margin-bottom:20px;padding:16px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:var(--radius);transition:.25s;cursor:pointer}
.timeline-item:hover{border-color:rgba(255,99,72,.35);transform:translateX(4px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.timeline-item::before{content:'';position:absolute;left:-30px;top:20px;width:12px;height:12px;background:var(--accent);border-radius:50%;border:2px solid var(--bg)}
.timeline-item .tl-year{font-size:.72rem;color:var(--gold);font-weight:700}
.timeline-item .tl-title{font-size:.95rem;font-weight:700;margin:2px 0}
.timeline-item .tl-desc{font-size:.78rem;color:var(--text2)}
.timeline-item .tl-era{font-size:.65rem;color:var(--accent);background:rgba(22,22,64,.5);padding:2px 8px;border-radius:8px;display:inline-block;margin-top:4px;border:1px solid rgba(60,60,120,.2)}

/* People grid */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.people-card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.25s}
.people-card:hover{transform:translateY(-2px);border-color:rgba(255,99,72,.35);box-shadow:var(--shadow)}
.people-card .p-era{font-size:.65rem;color:var(--accent);font-weight:600}
.people-card .p-name{font-size:1.05rem;font-weight:800;margin:2px 0}
.people-card .p-years{font-size:.72rem;color:var(--gold)}
.people-card .p-role{font-size:.78rem;color:var(--text2);margin-top:4px}
.people-card .p-desc{font-size:.75rem;color:var(--text3);margin-top:6px;line-height:1.5}

/* Quiz */
.quiz-container{max-width:640px;margin:0 auto}
.quiz-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.quiz-progress-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:.3s;border-radius:3px}
.quiz-progress-text{font-size:.75rem;color:var(--text2);min-width:60px;text-align:right}
.quiz-question{font-size:1.05rem;font-weight:700;margin-bottom:20px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{padding:14px 18px;background:rgba(22,22,64,.5);border:1px solid var(--glass-border);border-radius:10px;font-size:.88rem;text-align:left;color:var(--text);transition:.2s}
.quiz-option:hover:not(:disabled){border-color:rgba(255,99,72,.35);background:rgba(30,30,68,.6)}
.quiz-option.correct{border-color:var(--success);background:rgba(78,205,196,.12);color:var(--success)}
.quiz-option.wrong{border-color:var(--danger);background:rgba(255,107,107,.12);color:var(--danger)}
.quiz-option:disabled{cursor:default}
.quiz-explanation{margin-top:16px;padding:14px;background:rgba(14,14,38,.6);border:1px solid var(--glass-border);border-radius:10px;font-size:.82rem;color:var(--text2);line-height:1.6;display:none}
.quiz-explanation.show{display:block}
.quiz-next{margin-top:16px;padding:10px 28px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;font-size:.88rem;display:none;transition:.2s}
.quiz-next.show{display:inline-block}
.quiz-next:hover{background:var(--accent2)}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-score{font-size:3rem;font-weight:800;color:var(--accent)}
.quiz-score-label{font-size:1rem;color:var(--text2);margin-top:4px}
.quiz-restart{margin-top:20px;padding:12px 32px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;font-size:.9rem}
.quiz-restart:hover{background:var(--accent2)}
.quiz-category-selector{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.quiz-cat-btn{padding:6px 14px;border-radius:8px;font-size:.78rem;background:rgba(22,22,64,.5);color:var(--text2);border:1px solid var(--glass-border);transition:.2s}
.quiz-cat-btn:hover{border-color:rgba(255,99,72,.35)}
.quiz-cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Glossary */
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.glossary-item{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;transition:.2s}
.glossary-item:hover{border-color:rgba(255,99,72,.35)}
.glossary-item .g-term{font-size:1rem;font-weight:700;color:var(--accent)}
.glossary-item .g-reading{font-size:.72rem;color:var(--gold);margin-bottom:4px}
.glossary-item .g-def{font-size:.8rem;color:var(--text2);line-height:1.6}
.glossary-item .g-era{font-size:.65rem;color:var(--text3);margin-top:6px}
.glossary-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.glossary-filter-btn{padding:5px 12px;border-radius:8px;font-size:.75rem;background:rgba(22,22,64,.5);color:var(--text2);border:1px solid var(--glass-border);transition:.2s}
.glossary-filter-btn:hover{border-color:rgba(255,99,72,.35)}
.glossary-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Connections */
.connections-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.connection-card{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;transition:.2s}
.connection-card:hover{border-color:rgba(168,85,247,.4);box-shadow:0 4px 20px rgba(168,85,247,.08)}
.connection-card .c-title{font-size:.95rem;font-weight:700;margin-bottom:6px;color:var(--purple)}
.connection-card .c-eras{font-size:.7rem;color:var(--gold);margin-bottom:8px}
.connection-card .c-desc{font-size:.8rem;color:var(--text2);line-height:1.6}

/* Compare */
.compare-selector{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;align-items:end}
.compare-selector select{background:rgba(22,22,64,.6);border:1px solid var(--glass-border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.85rem;min-width:180px}
.compare-selector label{font-size:.78rem;color:var(--text2);margin-bottom:4px;display:block}
.compare-table{width:100%;border-collapse:collapse;font-size:.82rem}
.compare-table th{background:rgba(22,22,64,.5);padding:12px;text-align:left;color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.compare-table td{padding:12px;border-bottom:1px solid var(--glass-border);vertical-align:top}
.compare-table tr:hover td{background:rgba(20,20,52,.4)}
.compare-table .cat-label{color:var(--gold);font-weight:600;white-space:nowrap}

/* Bookmarks */
.bookmarks-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.bookmarks-empty .icon{font-size:2.5rem;margin-bottom:12px}

/* Search results */
.search-results{position:absolute;top:100%;left:0;right:0;background:rgba(14,14,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:0 0 12px 12px;max-height:400px;overflow-y:auto;display:none;z-index:101}
.search-results.open{display:block}
.search-result-item{padding:10px 14px;border-bottom:1px solid var(--glass-border);cursor:pointer;transition:.15s;font-size:.82rem}
.search-result-item:hover{background:rgba(26,26,62,.6)}
.search-result-item .sr-type{font-size:.65rem;color:var(--accent);font-weight:600}
.search-result-item .sr-title{font-weight:600}
.search-result-item .sr-desc{color:var(--text2);font-size:.75rem}

/* Stats bar */
.stats-bar{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px 20px;flex:1;min-width:120px;text-align:center}
.stat-card .stat-num{font-size:1.8rem;font-weight:800;color:var(--accent)}
.stat-card .stat-label{font-size:.72rem;color:var(--text2);margin-top:2px}

/* Filter chips */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:5px 14px;border-radius:20px;font-size:.75rem;background:rgba(22,22,64,.5);color:var(--text2);border:1px solid var(--glass-border);transition:.2s;cursor:pointer}
.filter-chip:hover{border-color:rgba(255,99,72,.35)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Scroll to top */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);color:var(--accent);font-size:1.2rem;display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.scroll-top.show{opacity:1;pointer-events:auto}
.scroll-top:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Keyboard hint */
.kbd-hint{position:fixed;bottom:24px;left:24px;font-size:.68rem;color:var(--text3);z-index:90;display:flex;gap:12px}
.kbd-hint kbd{background:rgba(22,22,64,.6);border:1px solid var(--glass-border);border-radius:4px;padding:1px 6px;font-family:inherit;font-size:.65rem}

/* Count badge */
.view-count{font-size:.8rem;color:var(--text3);font-weight:400;margin-left:8px}

/* Responsive */
@media(max-width:768px){
  .cards-grid{grid-template-columns:1fr}
  .people-grid{grid-template-columns:1fr}
  .glossary-grid{grid-template-columns:1fr}
  .connections-wrap{grid-template-columns:1fr}
  .header-search{width:140px;padding:3px 10px}
  .header-search input{font-size:.8rem}
  .header-title{font-size:1.1rem}
  .header-title span{display:none}
  .compare-selector{flex-direction:column;gap:10px}
  .detail-panel{margin-top:10px;border-radius:14px 14px 0 0}
  .detail-header{padding:20px 16px}
  .detail-body{padding:16px}
  .person-grid{grid-template-columns:1fr}
  .culture-grid{grid-template-columns:1fr 1fr}
  .stats-bar{gap:8px}
  .stat-card{min-width:0;padding:12px 8px}
  .stat-card .stat-num{font-size:1.4rem}
  .section-title{font-size:1.2rem;margin:24px 0 16px}
  .nav-btn{padding:8px 12px;font-size:.74rem}
  .scroll-top{bottom:16px;right:16px;width:40px;height:40px}
  .kbd-hint{display:none}
  .compare-table{font-size:.75rem}
  .compare-table th,.compare-table td{padding:8px 6px}
}
@media(max-width:400px){
  .header{padding:0 12px}
  .main{padding-left:10px;padding-right:10px}
  .culture-grid{grid-template-columns:1fr}
}

/* View transition */
.view{display:none}
.view.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Tab indicator animation */
.tab-indicator{position:absolute;bottom:0;height:2px;background:var(--accent);transition:.3s ease}

/* Tooltip */
.tooltip{position:relative}
.tooltip::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:rgba(22,22,64,.85);backdrop-filter:blur(8px);color:var(--text);font-size:.7rem;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;border:1px solid var(--glass-border)}
.tooltip:hover::after{opacity:1}
</style>
</head>
<body>

<header class="header">
  <div class="header-title">日本史<span>Japanese History</span></div>
  <div class="header-search" style="position:relative">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b6980" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="globalSearch" placeholder="検索... (人物・事件・用語)">
    <div class="search-results" id="searchResults"></div>
  </div>
</header>

<nav class="nav" id="mainNav">
  <button class="nav-btn active" data-view="home">概要</button>
  <button class="nav-btn" data-view="timeline">年表</button>
  <button class="nav-btn" data-view="eras">時代</button>
  <button class="nav-btn" data-view="people">人物</button>
  <button class="nav-btn" data-view="connections">関連</button>
  <button class="nav-btn" data-view="quiz">クイズ</button>
  <button class="nav-btn" data-view="glossary">用語集</button>
  <button class="nav-btn" data-view="compare">時代比較</button>
  <button class="nav-btn" data-view="bookmarks">ブックマーク</button>
</nav>

<main class="main">
  <!-- HOME -->
  <div class="view active" id="view-home">

    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const view = btn.dataset.view;
      document.getElementById('view-' + view).classList.add('active');
      currentView = view;
      if (view === 'bookmarks') renderBookmarks();
    });
  });
}

function switchView(viewName) {
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewName);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewName).classList.add('active');
  currentView = viewName;
}

      </div>
      <div class="detail-section">
        <h3>経済</h3>

            <div class="person-chip" onclick="openPersonDetail('${p.name.replace(/'/g,"\\'")}',${idx})">

function openPersonDetail(name, eraIdx) {
  const era = ERAS[eraIdx];

  if (!person) return;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-header">
      <button class="detail-close" onclick="closeDetail()">&times;</button>
      <div class="era-label">${era.name} / ${era.period}</div>
      <h2>${person.name}</h2>
      <div class="era-period-full">${person.years} / ${person.role}</div>
    </div>
    <div class="detail-body">
      <div class="detail-section">
        <h3>概要</h3>

  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();

// ===== TIMELINE =====
function renderTimeline() {
  const filters = document.getElementById('timelineFilters');
  filters.innerHTML = `<span class="filter-chip active" data-era="all" onclick="filterTimeline('all',this)">すべて</span>` +
    ERAS.map(e => `<span class="filter-chip" data-era="${e.id}" onclick="filterTimeline('${e.id}',this)">${e.name.split('時代')[0]}</span>`).join('');

  renderTimelineItems('all');
}

function filterTimeline(eraId, el) {
  document.querySelectorAll('#timelineFilters .filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTimelineItems(eraId);
}

function renderTimelineItems(filter) {
  const wrap = document.getElementById('timelineWrap');
  let items = [];
  ERAS.forEach((era, idx) => {
    if (filter !== 'all' && era.id !== filter) return;
    era.events.forEach(ev => {
      items.push({...ev, eraName: era.name, eraIdx: idx});
    });
  });
  // Sort by year (rough parse)
  items.sort((a, b) => {
    const ya = parseYear(a.year), yb = parseYear(b.year);
    return ya - yb;
  });
  document.getElementById('timelineCount').textContent = items.length + '件';
  wrap.innerHTML = '<div class="timeline-line"></div>' + items.map(item => `
    <div class="timeline-item" onclick="openEraDetail(${item.eraIdx})">
      <div class="tl-year">${item.year}</div>
      <div class="tl-title">${item.title}</div>
      <div class="tl-desc">${item.desc}</div>
      <span class="tl-era">${item.eraName}</span>
    </div>
  `).join('');
}

function parseYear(str) {
  const s = str.replace(/年|頃/g,'');
  if (s.startsWith('前')) return -parseInt(s.replace('前','').replace(/[万]/g,'0000')) || -10000;
  const n = parseInt(s);
  return isNaN(n) ? 0 : n;
}

// ===== QUIZ =====
function renderQuizCats() {
  const cats = ['all','古代','政治','文化','外交','軍事','経済','現代'];
  const labels = {'all':'全カテゴリ','古代':'古代','政治':'政治','文化':'文化','外交':'外交','軍事':'軍事','経済':'経済','現代':'現代'};
  document.getElementById('quizCats').innerHTML = cats.map(c =>
    `<button class="quiz-cat-btn ${c===quizState.category?'active':''}" onclick="setQuizCat('${c}',this)">${labels[c]}</button>`
  ).join('');
}

function setQuizCat(cat, el) {
  quizState.category = cat;
  document.querySelectorAll('.quiz-cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  startQuiz();
}

function startQuiz() {
  let qs = quizState.category === 'all' ? [...QUIZZES] : QUIZZES.filter(q => q.cat === quizState.category);
  // Shuffle
  for (let i = qs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qs[i], qs[j]] = [qs[j], qs[i]];
  }
  quizState.questions = qs.slice(0, Math.min(10, qs.length));
  quizState.current = 0;
  quizState.score = 0;
  quizState.answered = false;
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  if (quizState.current >= quizState.questions.length) {
    const pct = Math.round(quizState.score / quizState.questions.length * 100);
    container.innerHTML = `
      <div class="quiz-card quiz-result">
        <div class="quiz-score">${quizState.score}/${quizState.questions.length}</div>
        <div class="quiz-score-label">正解率 ${pct}%</div>
        <p style="margin-top:12px;color:var(--text2);font-size:.88rem">${pct>=80?'素晴らしい！日本史マスターです！':pct>=50?'なかなかの知識です。さらに学びましょう！':'まだまだ学べることがたくさんあります。頑張りましょう！'}</p>
        <button class="quiz-restart" onclick="startQuiz()">もう一度挑戦</button>
      </div>
    `;
    return;
  }
  const q = quizState.questions[quizState.current];
  const total = quizState.questions.length;
  const pct = (quizState.current / total) * 100;
  container.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-progress">
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
        <div class="quiz-progress-text">${quizState.current+1} / ${total}</div>
      </div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options">
        ${q.opts.map((opt, i) => `<button class="quiz-option" onclick="answerQuiz(${i})">${opt}</button>`).join('')}
      </div>
      <div class="quiz-explanation" id="quizExp">${q.exp}</div>
      <button class="quiz-next" id="quizNext" onclick="nextQuiz()">次の問題 &rarr;</button>
    </div>
  `;
  quizState.answered = false;
}

function answerQuiz(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.current];
  const btns = document.querySelectorAll('.quiz-option');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (q.opts[i] === q.a) btn.classList.add('correct');
    if (i === idx && q.opts[i] !== q.a) btn.classList.add('wrong');
  });
  if (q.opts[idx] === q.a) quizState.score++;
  document.getElementById('quizExp').classList.add('show');
  document.getElementById('quizNext').classList.add('show');
}

function nextQuiz() {
  quizState.current++;
  renderQuiz();
}

          <tr><td class="cat-label">${r.label}</td><td style="font-size:.82rem;line-height:1.7">${r.va}</td><td style="font-size:.82rem;line-height:1.7">${r.vb}</td></tr>
        `).join('')}</tbody>

    </div>
  `;
}

// ===== BOOKMARKS =====
function toggleBookmark(eraId, btn) {
  const idx = bookmarks.indexOf(eraId);
  if (idx >= 0) {
    bookmarks.splice(idx, 1);
  } else {
    bookmarks.push(eraId);
  }
  localStorage.setItem('jh_bookmarks', JSON.stringify(bookmarks));
  // Sync all bookmark buttons for this era across all views
  document.querySelectorAll('.bookmark-btn').forEach(b => {
    const card = b.closest('.era-card');
    if (!card) return;
    const onclick = b.getAttribute('onclick') || '';
    if (onclick.includes("'" + eraId + "'")) {
      b.classList.toggle('active', bookmarks.includes(eraId));
    }
  });
}

function renderBookmarks() {
  const content = document.getElementById('bookmarksContent');
  if (bookmarks.length === 0) {
    content.innerHTML = `<div class="bookmarks-empty"><div class="icon">&#9733;</div><p>ブックマークした時代がありません</p><p style="font-size:.82rem;margin-top:8px">時代カードの星マークをクリックしてブックマークしましょう</p></div>`;
    return;
  }
  const items = bookmarks.map(id => ERAS.find(e => e.id === id)).filter(Boolean);
  content.innerHTML = `<div class="cards-grid">${items.map((era, i) => {
    const realIdx = ERAS.indexOf(era);
    return `
      <div class="era-card" onclick="openEraDetail(${realIdx})">
        <button class="bookmark-btn active" onclick="event.stopPropagation();toggleBookmark('${era.id}',this);renderBookmarks()">&#9733;</button>
        <div class="era-period">${era.period}</div>
        <div class="era-name">${era.name}</div>
        <div class="era-subtitle">${era.subtitle}</div>
      </div>
    `;
  }).join('')}</div>`;
}

// ===== SEARCH =====
function initSearch() {
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 1) { results.classList.remove('open'); return; }

    let matches = [];

    // Search eras
    ERAS.forEach((era, idx) => {
      if (era.name.toLowerCase().includes(q) || era.subtitle.includes(q)) {
        matches.push({type:'時代', title:era.name, desc:era.subtitle, action:()=>{switchView('eras');openEraDetail(idx);}});
      }
      // Search events
      era.events.forEach(ev => {
        if (ev.title.includes(q) || ev.desc.includes(q)) {
          matches.push({type:'事件', title:ev.title, desc:`${ev.year} - ${era.name}`, action:()=>{switchView('eras');openEraDetail(idx);}});
        }
      });
      // Search people
      era.people.forEach(p => {
        if (p.name.includes(q) || p.role.includes(q) || p.desc.includes(q)) {
          matches.push({type:'人物', title:p.name, desc:`${p.role} - ${era.name}`, action:()=>{openPersonDetail(p.name, idx);}});
        }
      });
    });

    // Search glossary
    GLOSSARY.forEach(g => {
      if (g.term.includes(q) || g.reading.includes(q) || g.def.includes(q)) {
        matches.push({type:'用語', title:g.term, desc:g.def.substring(0,50)+'...', action:()=>{switchView('glossary');}});
      }
    });

    if (matches.length === 0) {
      results.innerHTML = '<div class="search-result-item"><span style="color:var(--text3)">結果が見つかりません</span></div>';
    } else {
      results.innerHTML = matches.slice(0, 15).map((m, i) => `
        <div class="search-result-item" data-idx="${i}">
          <div class="sr-type">${m.type}</div>
          <div class="sr-title">${m.title}</div>
          <div class="sr-desc">${m.desc}</div>
        </div>
      `).join('');
      results.querySelectorAll('.search-result-item').forEach((item, i) => {
        item.addEventListener('click', () => {
          matches[i].action();
          results.classList.remove('open');
          input.value = '';
        });
      });
    }
    results.classList.add('open');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.header-search')) results.classList.remove('open');
  });
}

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDetail();
    document.getElementById('globalSearch').blur();
    document.getElementById('searchResults').classList.remove('open');
  }
  if (e.key === '/' && !e.target.closest('input')) {
    e.preventDefault();
    document.getElementById('globalSearch').focus();
  }
});

// ===== SCROLL TO TOP =====
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTop');
  if (window.scrollY > 300) btn.classList.add('show');
  else btn.classList.remove('show');
}, {passive: true});
</script>
